<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anime Move Effects</title>
    <script type="module" crossorigin src="/assets/index-DpKj1Dlw.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-Dcq1sERF.css">
  </head>
  <body>
    <main class="layout">
      <section class="stage-wrap">
        <div id="stage" class="stage">
          <video id="video" playsinline muted></video>
          <canvas id="fx"></canvas>
          <canvas id="skeleton"></canvas>
          <div id="flash" class="flash"></div>
          <div id="banner" class="banner"></div>
          <div id="countdown" class="countdown"></div>
          <div id="status" class="status">Click “Start camera”</div>
        </div>
      </section>

      <aside class="panel">
        <h1>Anime Move Effects</h1>
        <div class="row">
          <button id="startBtn" class="primary">Start camera</button>
          <label class="check"><input type="checkbox" id="showSkeleton" checked /> Skeleton</label>
        </div>

        <h2>Live</h2>
        <div class="stats">
          <div>FPS <b id="fps">–</b></div>
          <div>Jump lift <b id="lift">–</b></div>
        </div>
        <div id="scores" class="scores"></div>
        <label class="slider">
          Sensitivity <span id="sensVal">1.00</span>
          <input type="range" id="sens" min="0.5" max="2" step="0.05" value="1" />
        </label>
        <label class="check"><input type="checkbox" id="mirrorInv" checked /> Match either side (left/right)</label>

        <h2>Moves</h2>
        <div class="row">
          <input id="moveName" placeholder="Move name (e.g. Rising Slash)" />
        </div>
        <div class="row">
          <select id="moveEffect">
            <option value="flame">Flame</option>
            <option value="water">Water</option>
            <option value="thunder">Thunder</option>
            <option value="wind">Wind</option>
          </select>
          <label class="inline">Length
            <select id="moveDur">
              <option value="1000">1.0 s</option>
              <option value="1500" selected>1.5 s</option>
              <option value="2000">2.0 s</option>
              <option value="2500">2.5 s</option>
            </select>
          </label>
        </div>
        <button id="recordBtn">Record template (3 s countdown)</button>
        <p class="hint">Record the same move 3–5 times. Then record idle so random movement doesn’t trigger it.</p>
        <button id="idleBtn">Record idle / random movement (6 s)</button>
        <div id="moveList" class="move-list"></div>

        <div class="row">
          <button id="exportBtn">Export JSON</button>
          <label class="file-btn">Import JSON<input type="file" id="importFile" accept="application/json" hidden /></label>
          <button id="testBtn" title="Preview effects">Test FX</button>
        </div>
      </aside>
    </main>
  </body>
</html>
